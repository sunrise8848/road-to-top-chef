<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f1">
  <title>灶边 - 我的菜谱库</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#" data-nav="library" aria-label="灶边首页">
        <span class="brand-mark">灶</span>
        <span>
          <strong>灶边</strong>
          <small>我的厨房手记</small>
        </span>
      </a>

      <nav class="nav-list">
        <button class="nav-item active" data-nav="library">
          <span class="nav-icon">⌂</span><span>菜谱库</span>
        </button>
        <button class="nav-item" data-nav="inbox">
          <span class="nav-icon">↓</span><span>待整理</span>
          <span class="badge" id="inboxCount">2</span>
        </button>
        <button class="nav-item" data-nav="favorites">
          <span class="nav-icon">☆</span><span>常做菜</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <p>本周做饭</p>
        <strong><span id="weekCount">3</span> 次</strong>
        <div class="progress"><span style="width: 60%"></span></div>
        <small>再做 2 次完成小目标</small>
      </div>
      <p class="storage-note">数据仅保存在此浏览器</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="打开菜单">☰</button>
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索菜名、食材或标签">
          <kbd>Ctrl K</kbd>
        </label>
        <button class="avatar" aria-label="个人资料">L</button>
      </header>

      <section id="viewRoot" class="view"></section>
    </main>
  </div>

  <dialog id="importDialog" class="modal">
    <form method="dialog" id="importForm">
      <div class="modal-head">
        <div>
          <span class="eyebrow">快速收录</span>
          <h2>保存一个新教程</h2>
        </div>
        <button class="icon-button" type="button" data-close-import aria-label="关闭">×</button>
      </div>
      <p class="modal-copy">粘贴教程文字，或上传包含食材和步骤的截图。一次最多选择 6 张图片。</p>
      <label class="field">
        <span>菜名或备注</span>
        <input name="title" type="text" placeholder="例如：看起来很下饭的鸡翅">
      </label>
      <label class="field">
        <span>教程文字或字幕</span>
        <textarea name="shareText" rows="5" placeholder="粘贴作者配文、食材清单、视频字幕或自己记录的步骤。"></textarea>
      </label>
      <label class="field">
        <span>菜谱图片</span>
        <input id="recipeImages" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <small class="field-help">支持 JPG、PNG、WebP，最多 6 张；图片仅用于识别并保存在当前浏览器。</small>
      </label>
      <div id="imagePreview" class="image-preview" aria-live="polite"></div>
      <div class="platform-row" aria-label="来源平台">
        <label><input type="radio" name="platform" value="小红书" checked><span>小红书</span></label>
        <label><input type="radio" name="platform" value="抖音"><span>抖音</span></label>
        <label><input type="radio" name="platform" value="其他"><span>其他</span></label>
      </div>
      <div class="modal-actions">
        <button class="button secondary" type="button" data-close-import>取消</button>
        <button class="button primary" type="submit" value="default">收进待整理</button>
      </div>
    </form>
  </dialog>

  <dialog id="recipeDialog" class="recipe-dialog">
    <div id="recipeDetail"></div>
  </dialog>

  <dialog id="organizeDialog" class="modal organize-modal">
    <form id="organizeForm">
      <div class="modal-head">
        <div>
          <span class="eyebrow">整理教程</span>
          <h2>生成新的菜谱</h2>
        </div>
        <button class="icon-button" type="button" data-close-organize aria-label="关闭">×</button>
      </div>
      <p class="modal-copy">把视频里的关键内容记下来。食材和步骤每行填写一项，之后可以直接进入做菜模式。</p>
      <div id="organizeStatus" class="recognize-status" role="status"></div>
      <input name="inboxId" type="hidden">
      <div class="form-grid">
        <label class="field field-wide">
          <span>菜名</span>
          <input name="title" type="text" required>
        </label>
        <label class="field">
          <span>预计用时（分钟）</span>
          <input name="time" type="number" min="1" value="30" required>
        </label>
        <label class="field">
          <span>份量（人份）</span>
          <input name="servings" type="number" min="1" value="2" required>
        </label>
        <label class="field">
          <span>难度</span>
          <select name="difficulty">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="较难">较难</option>
          </select>
        </label>
        <label class="field">
          <span>标签（用逗号分隔）</span>
          <input name="tags" type="text" placeholder="例如：快手菜, 下饭">
        </label>
        <label class="field field-wide">
          <span>食材（每行格式：食材 | 用量）</span>
          <textarea name="ingredients" rows="5" placeholder="鸡蛋 | 3个&#10;番茄 | 2个" required></textarea>
        </label>
        <label class="field field-wide">
          <span>制作步骤（每行一个步骤）</span>
          <textarea name="steps" rows="6" placeholder="番茄切块，鸡蛋打散。&#10;热锅倒油，将鸡蛋炒至凝固。" required></textarea>
        </label>
        <label class="field field-wide">
          <span>我的调整</span>
          <textarea name="note" rows="3" placeholder="记录下次制作时要注意的地方"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button class="button secondary" type="button" data-recognize>重新识别</button>
        <button class="button secondary" type="button" data-close-organize>取消</button>
        <button class="button primary" type="submit">生成菜谱</button>
      </div>
    </form>
  </dialog>

  <dialog id="cookDialog" class="cook-dialog">
    <div id="cookView"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
